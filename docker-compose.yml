services:
  mkr:
    build:
      dockerfile: ./Dockerfile
    # Tag explicite : Dockerfile.dev fait FROM monkey-resonance:latest, il faut
    # que `make build` produise exactement ce tag (sinon compose taggerait
    # monkey-resonance-mkr et le build dev échouerait).
    image: monkey-resonance:latest
    user: mkr
    stdin_open: true
    tty: true
    working_dir: /code/app
    volumes:
      # Mount the app source code
      - /home/ubuntu/projets/monkey-resonance:/code    
    devices:
      - "/dev/snd:/dev/snd"
    ports:
      # Both PROD and DEV use port 8005 for MCP
      # scripts/check-ports.sh will kill any existing process before launching
      - 8005:8005  
