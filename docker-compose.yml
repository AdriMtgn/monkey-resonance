services:
  mkr:
    build:
      dockerfile: ./Dockerfile
    # Tag dédié à l'expérience : ne remplace pas l'image pyo de `main`.
    # Pour revenir à pyo, rebuild depuis `main` (image monkey-resonance:latest).
    image: monkey-resonance-pedalboard:latest
    user: mkr
    stdin_open: true
    tty: true
    working_dir: /code/app
    volumes:
      # Mount the app source code (relative: works from any worktree)
      - .:/code
      # Données persistantes (records/, saved_effects/) partagées avec l'hôte.
      # Même chemin dans le container que APP_BASE_FOLDER (libs/utils.py).
      - ${MKR_DATA:-/home/ubuntu/monkey-resonance}:/monkey-resonance
    devices:
      - "/dev/snd:/dev/snd"
    ports:
      # API HTTP + MCP HTTP streamable (endpoint /mcp). MKR_PORT lets several
      # worktrees run side by side; scripts/check-ports.sh frees the port
      # before launch.
      - ${MKR_PORT:-8005}:8005
