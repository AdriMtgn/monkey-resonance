services:
  mkr:
    build:
      dockerfile: ./Dockerfile
    # Tag explicite : Dockerfile.dev fait FROM monkey-resonance:latest, il faut
    # que `make build` produise exactement ce tag (sinon compose taggerait
    # monkey-resonance-mkr et le build dev échouerait).
    image: monkey-resonance:latest
    user: mkr
    stdin_open: true
    tty: true
    working_dir: /code/app
    volumes:
      # Mount the app source code (relative: works from any worktree)
      - .:/code
    devices:
      - "/dev/snd:/dev/snd"
    ports:
      # API HTTP (MCP runs over stdio). MKR_PORT lets several worktrees run
      # side by side; scripts/check-ports.sh frees the port before launch.
      - ${MKR_PORT:-8005}:8005
