services:
  mkr:
    build:
      dockerfile: ./Dockerfile
    # Image du moteur Pedalboard. Dockerfile.dev fait FROM cette image : le
    # nom doit rester synchronisé avec la cible `build`.
    image: monkey-resonance-pedalboard:latest
    user: mkr
    stdin_open: true
    tty: true
    working_dir: /base_app/app
    volumes:
      # Mount the app source code (relative: works from any worktree)
      - .:/base_app
      # Données persistantes (records/, saved_effects/) partagées avec l'hôte.
      # Même chemin dans le container que APP_BASE_FOLDER (libs/utils.py).
      - ${MKR_DATA:-/home/ubuntu/monkey-resonance}:/monkey-resonance
    devices:
      - "/dev/snd:/dev/snd"
    ports:
      # API HTTP + MCP HTTP streamable (endpoint /mcp). MKR_PORT lets several
      # worktrees run side by side; scripts/check-ports.sh frees the port
      # before launch.
      - ${MKR_PORT:-8005}:8005
    environment:
      # Transmis au container depuis l'environnement hôte ou .env.
      MKR_MIDI: ${MKR_MIDI:-1}
      MKR_MIDI_CONFIG: ${MKR_MIDI_CONFIG:-}
      MKR_MIDI_MAP: ${MKR_MIDI_MAP:-}
      MKR_START_PRESET: ${MKR_START_PRESET:-}
    command: ["python", "-i", "main.py"]
