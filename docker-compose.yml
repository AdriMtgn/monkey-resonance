services:
  mkr:
    build:
      dockerfile: ./Dockerfile
    # Tag explicite : Dockerfile.dev fait FROM monkey-resonance:latest, il faut
    # que `make build` produise exactement ce tag (sinon compose taggerait
    # monkey-resonance-mkr et le build dev échouerait).
    image: monkey-resonance:latest
    user: mkr
    stdin_open: true
    tty: true
    volumes:
      # Volume shared between prod and dev images
      - /base_app:/base_app    
    devices:
      - "/dev/snd:/dev/snd"
    ports:
      # Production MCP uses port 8006 to avoid conflicts with dev (port 8005)
      # When both dev and prod run simultaneously, use different ports:
      # - Dev: port 8005
      # - Prod: port 8006
      # Change this to 8005 if you prefer single port usage
      - 8006:8005  
